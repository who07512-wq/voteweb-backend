# Grafana provisioning — Prometheus datasource for CampusVote.
#
# Point Grafana's provisioning folder at this directory. Example Docker
# compose for a local monitoring stack:
#
#   prometheus:
#     image: prom/prometheus:latest
#     container_name: campusvote-prometheus
#     volumes:
#       - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
#       - ./monitoring/metrics-token:/run/secrets/campusvote-metrics-token:ro
#     ports: ["9090:9090"]
#
#   grafana:
#     image: grafana/grafana:latest
#     container_name: campusvote-grafana
#     environment:
#       - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
#       - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
#     volumes:
#       - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
#       - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
#       - ./monitoring/grafana/dashboard-defs:/var/lib/grafana/dashboards:ro
#     ports: ["3000:3000"]
#     depends_on: [prometheus]
#
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false